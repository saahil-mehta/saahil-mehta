name: Render status graphics

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "assets/fonts/**"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render from saahil.co.uk/status.json
        run: python scripts/render_status.py
      - name: Commit when the graphics changed
        run: |
          if git diff --quiet -- assets; then
            echo "no change"
            exit 0
          fi
          git config user.name "Saahil Mehta (status render)"
          git config user.email "self@saahil.co.uk"
          git add assets
          git commit -m "chore: re-render status graphics from saahil.co.uk"
          git push
