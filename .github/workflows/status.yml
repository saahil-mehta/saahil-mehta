name: Render profile README

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "assets/fonts/**"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow fonttools
      - name: Render from saahil.co.uk/status.json
        run: python scripts/render_readme.py
      - name: Commit when anything changed
        run: |
          if git diff --quiet -- assets README.md; then
            echo "no change"
            exit 0
          fi
          git config user.name "Saahil Mehta (profile render)"
          git config user.email "self@saahil.co.uk"
          git add assets README.md
          git commit -m "chore: re-render the profile README from saahil.co.uk"
          git push
